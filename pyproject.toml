[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbft"
version = "0.1.0"
description = "Non-binary soil freeze-thaw retrieval from multi-frequency passive microwave (SMAP L-band + AMSR2)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Hesam Salmabadi", email = "hesam.salmabadi@gmail.com" },
  { name = "Aaron Berg" },
  { name = "Alexandre Roy" },
]
# Runtime dependencies are managed through environment.yml (conda/micromamba).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
